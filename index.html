<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reto comprar una casa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f13; color: #e8e8f0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; padding: 40px 20px 60px;
    }
    .container { width: 100%; max-width: 920px; }

    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-size: 2.3rem; font-weight: 700; letter-spacing: -0.5px; color: #fff; }
    header h1 span { color: #4ade80; }
    header p { margin-top: 6px; color: #6b6b80; font-size: 0.95rem; }
    .hero-img { display: block; width: 100%; height: auto; border-radius: 16px; }
    .conn-status { min-height: 18px; margin-top: 10px; font-size: 0.8rem; color: #6b6b80; text-align: center; transition: color .2s; }
    .conn-status.err { color: #ef4444; }
    .conn-status.ok  { color: #4ade80; }

    .section-title { font-size: 1.1rem; font-weight: 700; color: #fff; letter-spacing: .02em; margin-bottom: 14px; text-transform: uppercase; }
    .section-title small { display:block; text-transform:none; letter-spacing:0; font-weight:400; color:#6b6b80; font-size:.78rem; margin-top:3px; }
    .section-title.center { text-align: center; font-size: 1.7rem; }

    /* GLOBAL TOTAL */
    .total-section { background: #1a1a24; border: 1px solid #2a2a38; border-radius: 20px; padding: 26px 32px; margin-bottom: 30px; }
    .total-labels { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; flex-wrap: wrap; gap: 6px; }
    .total-amount { font-size: 2.1rem; font-weight: 700; color: #fff; }
    .total-amount .unit { font-size: 1.1rem; color: #6b6b80; margin-left: 2px; }
    .total-goal { font-size: 0.95rem; color: #6b6b80; }
    .total-goal strong { color: #a0a0b8; }
    .bar-wrapper { background: #2a2a38; border-radius: 999px; height: 30px; overflow: hidden; position: relative; }
    .bar-green { background: linear-gradient(90deg, #16a34a, #4ade80); height: 100%; width: 0%; transition: width .5s cubic-bezier(.4,0,.2,1); }
    .bar-percent { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: .82rem; font-weight: 600; color: rgba(255,255,255,.6); pointer-events: none; }
    .total-left { margin-top: 12px; font-size: .9rem; color: #6b6b80; text-align: right; }
    .total-left strong { color: #4ade80; }

    /* PARTICIPANTS GRID */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
    /* Andrés ocupa una fila entera y va más grande */
    .card.wide { grid-column: 1 / -1; padding: 26px; gap: 16px; }
    .card.wide .avatar { width: 76px; height: 76px; }
    .card.wide .card-head { gap: 18px; }
    .card.wide .card-head .name { font-size: 2rem; }
    .card.wide .card-head .amount { font-size: 1.7rem; }
    .card.wide .subh { font-size: 1rem; }
    .card.wide .cbar-legend span { font-size: .8rem; }
    .card.wide .cbar-legend { gap: 6px 18px; margin-top: 9px; }
    .card.wide .cstat .lab { font-size: .76rem; }
    .card.wide .cstat .v { font-size: 1.3rem; }
    .card.wide .cbar-wrapper { height: 34px; }
    .card.wide .cbar-pct-out { font-size: 1.05rem; }
    .card.wide .day-title { font-size: .95rem; }
    .card.wide .day-grid { max-height: none; }
    .card.wide .add-card h3 { font-size: 1rem; }
    .card { position: relative; background: #1a1a24; border: 1px solid #2a2a38; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .crown-badge { position: absolute; top: -16px; right: -8px; width: 50px; transform: rotate(14deg); filter: drop-shadow(0 3px 5px rgba(0,0,0,.5)); pointer-events: none; z-index: 6; transform-origin: center bottom; animation: crownPop .4s cubic-bezier(.34,1.56,.64,1); }
    .crown-badge[hidden] { display: none; }
    .crown-badge svg { width: 100%; height: auto; display: block; }
    @keyframes crownPop { from { transform: rotate(14deg) scale(0); } to { transform: rotate(14deg) scale(1); } }
    .card-head { display: flex; align-items: center; gap: 14px; }
    .avatar { width: 58px; height: 58px; border-radius: 50%; flex-shrink: 0; cursor: pointer; position: relative; user-select: none; }
    .avatar-clip { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; border: 2px solid #2a2a38; transition: border-color .2s; background: #14141c; }
    .avatar:hover .avatar-clip { border-color: #4ade80; }
    .avatar .letter { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.3rem; color: #0f0f13; }
    .avatar .avatar-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
    .avatar .cam { position: absolute; bottom: -2px; right: -2px; width: 20px; height: 20px; border-radius: 50%; background: #4ade80; color: #052e16; font-size: 11px; display: flex; align-items: center; justify-content: center; border: 2px solid #1a1a24; z-index: 3; }
    .card-head .who { display: flex; flex-direction: row; align-items: baseline; flex-wrap: wrap; gap: 3px 10px; min-width: 0; }
    .card-head .name { font-size: 1.5rem; font-weight: 700; color: #FFD24A; }
    .card-head .amount { font-size: 1.3rem; font-weight: 700; color: #4ade80; }
    .mini-bar { background: #2a2a38; border-radius: 999px; height: 10px; overflow: hidden; }
    .mini-fill { background: linear-gradient(90deg, #16a34a, #4ade80); height: 100%; width: 0%; transition: width .5s cubic-bezier(.4,0,.2,1); }
    .mini-pct { font-size: .72rem; color: #6b6b80; }

    .input-row { display: flex; gap: 6px; }
    .input-row input {
      flex: 1; background: #0f0f13; border: 1px solid #2a2a38; border-radius: 10px; color: #fff;
      font-size: .95rem; padding: 9px 12px; outline: none; transition: border-color .2s; min-width: 0;
    }
    .input-row input:focus { border-color: #4ade80; }
    .input-row input::placeholder { color: #3a3a50; }
    .input-row input.error { border-color: #ef4444 !important; animation: shake .35s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }

    .btn { border: none; border-radius: 10px; font-size: 1.05rem; font-weight: 700; cursor: pointer; padding: 9px 14px; transition: opacity .15s, transform .1s; }
    .btn:active { transform: scale(.94); }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .45; cursor: default; transform: none; }
    .btn-add { background: #4ade80; color: #052e16; }
    .btn-sub { background: #3a3a48; color: #fff; }
    .btn-sm { font-size: .85rem; padding: 8px 12px; }
    .btn-burn { background: #7f1d1d; color: #fecaca; font-size: .85rem; width: 100%; }

    .hist { display: flex; flex-direction: column; gap: 5px; max-height: 132px; overflow-y: auto; padding-right: 2px; }
    .hist.sm { max-height: 100px; }
    .hist::-webkit-scrollbar { width: 4px; }
    .hist::-webkit-scrollbar-thumb { background: #2a2a38; border-radius: 4px; }
    .hist-empty { font-size: .8rem; color: #3a3a50; text-align: center; padding: 6px 0; }
    .move { display: flex; align-items: center; justify-content: space-between; background: #22222e; border-radius: 8px; padding: 6px 10px; font-size: .85rem; animation: fadeIn .2s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
    .move .lbl { color:#c0c0d0; display:flex; align-items:center; gap:7px; }
    .move .dotmini { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .move .val { font-weight: 700; }
    .move .val.up { color: #4ade80; }
    .move .val.down { color: #f59e0b; }
    .move .del { background: none; border: none; color: #3a3a50; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 0 0 8px; transition: color .15s; }
    .move .del:hover { color: #ef4444; }

    /* PROFILE SUB-BLOCKS (caja fuerte / generado / trading) */
    .blk { border-top: 1px solid #2a2a38; padding-top: 12px; display: flex; flex-direction: column; gap: 9px; }
    .subh { font-size: .82rem; font-weight: 700; color: #a0a0b8; display: flex; align-items: center; gap: 6px; }
    .subh b { color: #4ade80; }
    .cf-goal { margin-left: auto; font-size: .72rem; font-weight: 400; color: #6b6b80; cursor: pointer; user-select: none; white-space: nowrap; }
    .cf-goal b { color: #a0a0b8; font-weight: 700; }
    .cf-goal:hover { color: #a0a0b8; }

    /* TRADING */
    .tr-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .tr-cur { font-size: 1.4rem; font-weight: 700; color: #a1a1aa; }
    .tr-cur.pos { color: #4ade80; } .tr-cur.neg { color: #ef4444; }
    .tr-phase { font-size: .72rem; color: #6b6b80; text-align: right; }
    .tr-bar { position: relative; height: 22px; background: #2a2a38; border-radius: 999px; overflow: hidden; }
    .tr-fill { position: absolute; top: 0; bottom: 0; left: 50%; width: 0; transition: left .4s, width .4s; }
    .tr-mark { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,.18); }
    .tr-mark.ph { background: rgba(74,222,128,.6); }
    .tr-legend { font-size: .65rem; color: #3a3a50; display: flex; justify-content: space-between; }
    .tr-chart-title { font-size: .72rem; color: #a0a0b8; margin-top: 14px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .tr-chart { width: 100%; height: auto; display: block; background: #14141c; border: 1px solid #2a2a38; border-radius: 10px; }

    footer { margin-top: 30px; text-align: center; color: #3a3a50; font-size: .8rem; }

    /* DIVIDER + CLASSIC */
    .divider { height: 1px; background: #2a2a38; margin: 46px 0 26px; }
    .classic-section { background: #1a1a24; border: 1px solid #2a2a38; border-radius: 20px; padding: 28px 32px; }
    .classic-head { text-align: center; margin-bottom: 22px; }
    .classic-head h2 { font-size: 1.6rem; font-weight: 700; color: #fff; }
    .classic-head h2 span { color: #4ade80; }
    .classic-head p { margin-top: 5px; color: #6b6b80; font-size: .88rem; }

    .cbar-row { display: flex; align-items: center; gap: 10px; }
    .cbar-row .cbar-wrapper { flex: 1; min-width: 0; }
    .cbar-pct-out { font-size: .9rem; font-weight: 700; color: rgba(255,255,255,.7); white-space: nowrap; flex-shrink: 0; }
    .cbar-wrapper { background: #2a2a38; border-radius: 999px; height: 28px; overflow: hidden; position: relative; }
    .cbar-fill { height: 100%; display: flex; border-radius: 999px; overflow: hidden; min-width: 0; }
    .cbar-green { background: linear-gradient(90deg, #16a34a, #4ade80); height: 100%; width: 0%; transition: width .5s cubic-bezier(.4,0,.2,1); }
    .cbar-gray  { background: linear-gradient(90deg, #52525b, #a1a1aa); height: 100%; width: 0%; transition: width .5s cubic-bezier(.4,0,.2,1); }

    .cstats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .cstat { flex: 1 1 64px; min-width: 0; background: #22222e; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
    .cstat .lab { font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; color: #6b6b80; }
    .cstat .v { font-size: 1rem; font-weight: 700; }
    .cstat .v.green { color: #4ade80; }
    .cstat .v.gray  { color: #a1a1aa; }
    .cstat .v.white { color: #fff; }

    .cadd { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin: 16px 0; }
    .cbar-mark { position: absolute; top: 0; bottom: 0; width: 3px; transform: translateX(-50%); background: #ef4444; box-shadow: 0 0 0 1px rgba(0,0,0,.45); opacity: 1; z-index: 2; }
    .cbar-mark.s-yellow { background: #f59e0b; }
    .cbar-mark.s-green { background: #4ade80; }
    .cbar-legend { display: flex; flex-wrap: wrap; gap: 3px 12px; margin-top: 6px; }
    .cbar-legend span { font-size: .64rem; font-weight: 600; white-space: nowrap; color: #ef4444; }
    .cbar-legend span.s-yellow { color: #f59e0b; }
    .cbar-legend span.s-green { color: #4ade80; }
    .cbar-legend span.shop-link { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
    .cbar-legend span.shop-link:hover { filter: brightness(1.3); }
    .shop-n { font-weight: 800; }
    /* Recuadro de lista de la compra */
    .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
    .modal-back[hidden] { display: none; }
    .modal { background: #1a1a24; border: 1px solid #2a2a38; border-radius: 16px; padding: 18px; width: 100%; max-width: 430px; max-height: 82vh; display: flex; flex-direction: column; gap: 12px; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .modal-head h3 { font-size: 1.1rem; font-weight: 700; color: #fff; }
    .modal-x { background: none; border: none; color: #6b6b80; font-size: 1.5rem; cursor: pointer; line-height: 1; padding: 0 6px; }
    .modal-x:hover { color: #ef4444; }
    .shop-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
    .shop-item { display: flex; align-items: center; gap: 9px; background: #22222e; border-radius: 10px; padding: 8px 10px; }
    .shop-item .nm { flex: 1; min-width: 0; font-size: .9rem; word-break: break-word; }
    .shop-item.done .nm { text-decoration: line-through; color: #6b6b80; }
    .shop-item .chk { width: 17px; height: 17px; flex-shrink: 0; cursor: pointer; accent-color: #4ade80; }
    .shop-item .x { background: none; border: none; color: #3a3a50; cursor: pointer; font-size: 1.05rem; line-height: 1; padding: 2px 4px; }
    .shop-item .x:hover { color: #ef4444; }
    .shop-empty { font-size: .82rem; color: #3a3a50; text-align: center; padding: 12px 0; }
    .add-card { background: #14141c; border: 1px solid #2a2a38; border-radius: 14px; padding: 12px; min-width: 0; }
    .add-card h3 { font-size: .9rem; font-weight: 600; margin-bottom: 3px; display: flex; align-items: center; gap: 7px; }
    .add-card .desc { font-size: .72rem; color: #6b6b80; margin-bottom: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot.green { background: #4ade80; }
    .dot.gray  { background: #a1a1aa; }

    .day-block { margin-top: 16px; }
    .day-title { font-size: .85rem; font-weight: 700; color: #a0a0b8; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .day-grid { display: flex; flex-wrap: wrap; gap: 6px; max-height: 124px; overflow-y: auto; padding-right: 2px; }
    .day-grid::-webkit-scrollbar { width: 4px; }
    .day-grid::-webkit-scrollbar-thumb { background: #2a2a38; border-radius: 4px; }
    .day-sq { position: relative; min-width: 56px; max-width: 100%; background: #22222e; border: 1px solid #2a2a38; border-radius: 9px; padding: 5px 17px 5px 8px; display: flex; flex-direction: column; gap: 1px; }
    .day-sq .d { font-size: .6rem; color: #6b6b80; line-height: 1.15; white-space: nowrap; }
    .day-sq .m { font-size: .86rem; font-weight: 700; line-height: 1.2; color: #a1a1aa; white-space: nowrap; }
    .day-sq .m.up { color: #4ade80; }
    .day-sq .m.down { color: #f59e0b; }
    .day-sq.empty { opacity: .5; }
    .day-sq.empty .m { color: #3a3a50; }
    .day-sq.today { border-color: #a1a1aa; }
    .day-sq .x { position: absolute; top: 1px; right: 3px; background: none; border: none; color: #3a3a50; cursor: pointer; font-size: .82rem; line-height: 1; padding: 2px; }
    .day-sq .x:hover { color: #ef4444; }

    @media (max-width: 560px) { .cstats { flex-wrap: wrap; } .cstat { min-width: calc(50% - 6px); } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img class="hero-img" src="portada.jpg" alt="Reto comprar una casa">
      <div class="conn-status" id="conn-status"></div>
    </header>

    <!-- BARRA GLOBAL -->
    <div class="section-title center">Caja fuerte global</div>
    <div class="total-section">
      <div class="total-labels">
        <div class="total-amount" id="total-amount">0<span class="unit">€</span></div>
        <div class="total-goal">Objetivo: <strong id="total-goal-amount">1.500.000€</strong></div>
      </div>
      <div class="bar-wrapper">
        <div class="bar-green" id="total-bar"></div>
        <span class="bar-percent" id="total-pct">0%</span>
      </div>
      <div class="total-left">Faltan <strong id="total-left">1.500.000€</strong></div>
    </div>

    <!-- TABLEROS INDIVIDUALES -->
    <div class="grid" id="grid"></div>

    <footer>Reto comprar una casa · caja fuerte, generado y trading por perfil · datos compartidos en tiempo real</footer>
  </div>

  <!-- Lista de la compra (compra 1 / compra 2) -->
  <div class="modal-back" id="shop-modal" hidden onclick="if(event.target===this) closeShop()">
    <div class="modal">
      <div class="modal-head">
        <h3 id="shop-title">Compra 1</h3>
        <button class="modal-x" onclick="closeShop()" title="Cerrar">×</button>
      </div>
      <div class="input-row">
        <input id="shop-input" type="text" maxlength="60" placeholder="Añadir alimento…">
        <button class="btn btn-add btn-sm" onclick="addShopItem()">Añadir</button>
      </div>
      <div class="shop-list" id="shop-list"></div>
    </div>
  </div>

  <script>
    const DEFAULT_GOAL = 300000;    // objetivo por defecto de cada caja fuerte
    const GOAL_CLASSIC = 500;       // recibido / pendiente (3er apartado de Andrés)
    const RENT = 280;               // marcador en la barra: alquiler cubierto
    const DB = 'https://reto-500-default-rtdb.firebaseio.com';
    const PEOPLE = [
      { id: 'andres', name: 'Andrés', color: '#4ade80' },
      { id: 'julian', name: 'Julián', color: '#60a5fa' },
      { id: 'jorge',  name: 'Jorge',  color: '#f472b6' },
      { id: 'jose',   name: 'José',   color: '#fbbf24' },
      { id: 'arturo', name: 'Arturo', color: '#a78bfa' }
    ];
    const TRADERS = ['julian', 'jorge']; // perfiles con barra de trading

    let moves = {};       // caja fuerte: { id: { key: {amount} } }
    let photos = {};      // { id: dataURL }
    let goals = {};       // { id: objetivoPersonal }
    let generated = {};   // generado diario: { id: { key: {amount, day} } }
    let trading = {};     // { id: { current, log: { key: {pct,day}|{burned,day} } } }
    let classic = {};     // reto 500€: { key: {type, amount, day} }
    const busy = {};

    const fmt = n => Number(n || 0).toLocaleString('es-ES', { maximumFractionDigits: 2 });
    const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const dayLabel = ds => { const p = (ds || '').split('-'); return p.length === 3 ? (Number(p[2]) + ' ' + MESES[Number(p[1]) - 1]) : ''; };
    const START_PENDING = new Date(2026, 5, 5); // 5 de junio de 2026 (inicio del historial diario)
    const PHASE_TARGET = { 1: 8, 2: 5 };  // fondeo: Fase 1 → +8% · Fase 2 → +5%
    const TR_MIN = -8;                     // límite de pérdida (ambas fases)
    const trPos = (pct, target) => (Math.max(TR_MIN, Math.min(target, Number(pct) || 0)) - TR_MIN) / (target - TR_MIN) * 100;
    const goalOf = id => { const v = goals[id]; return (v != null && Number(v) > 0) ? Number(v) : DEFAULT_GOAL; };
    const nameOf = id => { const p = PEOPLE.find(x => x.id === id); return p ? p.name : id; };

    function setStatus(text, kind) {
      const el = document.getElementById('conn-status');
      el.textContent = text || '';
      el.className = 'conn-status' + (kind ? ' ' + kind : '');
    }

    function personTotal(id) {
      const m = moves[id] || {};
      return Object.keys(m).reduce((s, k) => s + Number(m[k].amount || 0), 0);
    }
    function genTotal(id) {
      const g = generated[id] || {};
      return Object.keys(g).reduce((s, k) => s + Number(g[k].amount || 0), 0);
    }

    function shake(input) {
      input.classList.remove('error'); void input.offsetWidth; input.classList.add('error');
      input.focus(); setTimeout(() => input.classList.remove('error'), 600);
    }

    // ---------- Construir tarjetas ----------
    function buildCards() {
      document.getElementById('grid').innerHTML = PEOPLE.map(p => `
        <div class="card${p.id === 'andres' ? ' wide' : ''}">
          <div class="crown-badge" id="crown-${p.id}" title="Líder de la caja fuerte" hidden>
            <svg viewBox="0 0 64 47" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M5,33 L10,12 L22,26 L32,6 L42,26 L54,12 L59,33 Z" fill="#F7C600" stroke="#4A3500" stroke-width="2.4" stroke-linejoin="round"/>
              <rect x="6" y="31" width="52" height="13" rx="4" fill="#F7C600" stroke="#4A3500" stroke-width="2.4"/>

    function renderPhoto(id) {

    }

    // ---------- Caja fuerte + global ----------
    function render() {
      const sumGoals = PEOPLE.reduce((s, p) => s + goalOf(p.id), 0);
      let total = 0;
      PEOPLE.forEach(p => {
        const t = personTotal(p.id); total += t;
        const g = goalOf(p.id);
        const pct = Math.min((t / g) * 100, 100);
        document.getElementById('amount-' + p.id).textContent = fmt(t) + '€';
        document.getElementById('fill-' + p.id).style.width = pct + '%';
        document.getElementById('pct-' + p.id).textContent = (pct < 1 && t > 0 ? pct.toFixed(1) : Math.round(pct)) + '% de ' + fmt(g) + '€';
        const goalEl = document.getElementById('goal-' + p.id);
        if (goalEl) goalEl.innerHTML = 'Objetivo: <b>' + fmt(g) + '€</b> ✎';

        const m = moves[p.id] || {};
        const keys = Object.keys(m).sort((a, b) => (a < b ? 1 : -1));
        const hist = document.getElementById('hist-' + p.id);
        hist.innerHTML = keys.length === 0 ? '<div class="hist-empty">Sin movimientos</div>' : keys.map(k => {
          const a = Number(m[k].amount || 0), up = a >= 0;
          return `<div class="day-sq"><span class="m ${up?'up':'down'}">${up?'+':'−'}${fmt(Math.abs(a))}€</span><button class="x" onclick="deleteMove('${p.id}','${k}')" title="Eliminar">×</button></div>`;
        }).join('');
      });

      // 👑 Corona para quien más dinero tiene en la caja fuerte
      let leader = null, leaderVal = -1;
      PEOPLE.forEach(p => { const t = personTotal(p.id); if (t > leaderVal) { leaderVal = t; leader = p.id; } });
      PEOPLE.forEach(p => { const c = document.getElementById('crown-' + p.id); if (c) c.hidden = !(leader === p.id && leaderVal > 0); });

      const pctTotal = Math.min((total / sumGoals) * 100, 100);
      document.getElementById('total-amount').innerHTML = fmt(total) + '<span class="unit">€</span>';
      document.getElementById('total-bar').style.width = pctTotal + '%';
      document.getElementById('total-pct').textContent = (pctTotal < 1 && total > 0 ? pctTotal.toFixed(2) : Math.round(pctTotal)) + '%';
      document.getElementById('total-goal-amount').textContent = fmt(sumGoals) + '€';
      document.getElementById('total-left').textContent = fmt(Math.max(0, sumGoals - total)) + '€';
    }

    function renderGenerated(id) {
      const g = generated[id] || {};
      const tEl = document.getElementById('gentotal-' + id); if (tEl) tEl.textContent = fmt(genTotal(id)) + '€';
      const keys = Object.keys(g).sort((a, b) => (a < b ? 1 : -1));
      const h = document.getElementById('ghist-' + id); if (!h) return;
      h.innerHTML = keys.length === 0 ? '<div class="hist-empty">Sin generado aún</div>' : keys.map(k => {
        const e = g[k];
        return `<div class="day-sq"><span class="d">${dayLabel(e.day)}</span><span class="m up">+${fmt(e.amount)}€</span><button class="x" onclick="deleteGenerated('${id}','${k}')" title="Eliminar">×</button></div>`;
      }).join('');
    }

    function renderTrading(id) {
      const t = trading[id] || {};
      const funded = !!t.funded;
      const phase = Number(t.phase || 1);
      const target = PHASE_TARGET[phase] || 8;
      const c = Math.max(TR_MIN, Math.min(target, Number(t.current || 0)));
      const curEl = document.getElementById('trcur-' + id); if (!curEl) return;
      curEl.textContent = (c > 0 ? '+' : '') + (Math.round(c * 100) / 100) + '%';
      curEl.className = 'tr-cur ' + (c > 0 ? 'pos' : (c < 0 ? 'neg' : ''));
      const phEl = document.getElementById('trphase-' + id);
      if (funded) phEl.textContent = '✅ Cuenta fondeada';
      else if (c <= TR_MIN) phEl.textContent = '🔥 Límite -8% · cuenta perdida';
      else phEl.textContent = 'Fase ' + phase + ' de 2 · objetivo +' + target + '%';
      document.getElementById('trhi-' + id).textContent = 'obj +' + target + '%';

      const fill = document.getElementById('trfill-' + id);
      const zero = trPos(0, target), pos = trPos(c, target);
      if (c >= 0) { fill.style.left = zero + '%'; fill.style.width = (pos - zero) + '%'; fill.style.background = 'linear-gradient(90deg,#16a34a,#4ade80)'; }
      else { fill.style.left = pos + '%'; fill.style.width = (zero - pos) + '%'; fill.style.background = 'linear-gradient(90deg,#ef4444,#f59e0b)'; }
      const zEl = document.getElementById('trzero-' + id); if (zEl) zEl.style.left = zero + '%';

      const log = t.log || {};
      const keys = Object.keys(log).sort((a, b) => (a < b ? 1 : -1));
      const h = document.getElementById('thist-' + id);
      h.innerHTML = keys.length === 0 ? '<div class="hist-empty">Sin registros</div>' : keys.map(k => {
        const e = log[k]; let cls = 'up', txt;
        if (e.burned) { cls = 'down'; txt = '🔥'; }
        else if (e.pass) { cls = 'up'; txt = '✅ F' + e.pass; }
        else if (e.funded) { cls = 'up'; txt = '🏆'; }
        else { const v = Number(e.pct || 0); cls = v >= 0 ? 'up' : 'down'; txt = (v > 0 ? '+' : '') + v + '%'; }
        return `<div class="day-sq"><span class="d">${dayLabel(e.day)}</span><span class="m ${cls}">${txt}</span><button class="x" onclick="deleteTradingLog('${id}','${k}')" title="Eliminar">×</button></div>`;
      }).join('');
      renderTradingChart(id, log);
    }

    // Sábado(6) o Domingo(0) → se excluyen de la gráfica de trading
    function isWeekendDay(ds) {
      const p = (ds || '').split('-');
      if (p.length !== 3) return false;
      const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
      const w = d.getDay();
      return w === 0 || w === 6;
    }

    // Gráfica de la evolución del % de trading (solo días de semana)
    function renderTradingChart(id, log) {
      const svg = document.getElementById('trchart-' + id); if (!svg) return;
      const W = 300, H = 96, x0 = 10, x1 = W - 10, y0 = 12, y1 = H - 12;
      const lo = -8, hi = 8;
      const yOf = v => y1 - ((Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo)) * (y1 - y0);
      const zeroY = yOf(0);
      const keysAsc = Object.keys(log || {}).sort();
      const pts = keysAsc.map(k => log[k])
        .filter(e => e && e.pct !== undefined && e.pct !== null && !isWeekendDay(e.day))
        .map(e => ({ day: e.day, pct: Number(e.pct) || 0 }));
      let inner = `<line x1="${x0}" y1="${zeroY}" x2="${x1}" y2="${zeroY}" stroke="rgba(255,255,255,.18)" stroke-width="1"/>`;
      inner += `<text x="${x0}" y="${zeroY - 3}" font-size="7" fill="#6b6b80">0%</text>`;
      if (pts.length === 0) {
        svg.innerHTML = inner + `<text x="${W / 2}" y="${H / 2 + 10}" font-size="9" fill="#3a3a50" text-anchor="middle">Sin registros de lun–vie</text>`;
        return;
      }
      const n = pts.length;
      const xOf = i => n === 1 ? (x0 + x1) / 2 : x0 + (i / (n - 1)) * (x1 - x0);
      const coords = pts.map((p, i) => [Math.round(xOf(i) * 10) / 10, Math.round(yOf(p.pct) * 10) / 10]);
      const last = pts[n - 1].pct;
      const col = last >= 0 ? '#4ade80' : '#f59e0b';
      const area = `M${coords[0][0]},${zeroY} ` + coords.map(c => `L${c[0]},${c[1]}`).join(' ') + ` L${coords[n - 1][0]},${zeroY} Z`;
      inner += `<path d="${area}" fill="${col}" opacity=".13"/>`;
      if (n > 1) inner += `<path d="M${coords.map(c => c[0] + ',' + c[1]).join(' L')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      inner += coords.map((c, i) => `<circle cx="${c[0]}" cy="${c[1]}" r="${n > 22 ? 1.6 : 2.4}" fill="${pts[i].pct >= 0 ? '#4ade80' : '#f59e0b'}"/>`).join('');
      svg.innerHTML = inner;
    }

    // ---------- Fetch ----------
    async function fetchMoves(silent) {
      try {
        const res = await fetch(DB + '/moves.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        moves = (await res.json()) || {};
        render(); setStatus('', '');
      } catch (e) { if (!silent) setStatus('⚠ No se pudo conectar con la base de datos', 'err'); }
    }
    async function fetchGoals() {
      try { const res = await fetch(DB + '/goals.json', { cache: 'no-store' }); if (!res.ok) return; goals = (await res.json()) || {}; render(); } catch (e) {}
    }
    async function fetchGenerated() {
      try { const res = await fetch(DB + '/generated.json', { cache: 'no-store' }); if (!res.ok) return; generated = (await res.json()) || {}; PEOPLE.forEach(p => renderGenerated(p.id)); renderClassic(); } catch (e) {}
    }
    async function fetchTrading() {
      try { const res = await fetch(DB + '/trading.json', { cache: 'no-store' }); if (!res.ok) return; trading = (await res.json()) || {}; TRADERS.forEach(renderTrading); } catch (e) {}
    }
    async function fetchPhotos() {
      try { const res = await fetch(DB + '/photos.json', { cache: 'no-store' }); if (!res.ok) return; photos = (await res.json()) || {}; PEOPLE.forEach(p => renderPhoto(p.id)); } catch (e) {}
    }

    // ---------- Caja fuerte: añadir/quitar ----------
    async function addMove(id, sign) {
      if (busy[id]) return;
      const input = document.getElementById('input-' + id);
      let amount = parseFloat(input.value);
      if (!amount || amount <= 0) { shake(input); return; }
      if (sign < 0) { amount = Math.min(amount, personTotal(id)); if (amount <= 0) { input.value = ''; return; } }
      const value = sign < 0 ? -amount : amount;
      busy[id] = true;
      document.getElementById('add-' + id).disabled = true; document.getElementById('sub-' + id).disabled = true;
      setStatus('Guardando…', '');
      try {
        const res = await fetch(DB + '/moves/' + id + '.json', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: Math.round(value * 100) / 100 })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        input.value = ''; await fetchMoves();
        setStatus('Guardado ✓', 'ok'); setTimeout(() => setStatus('', ''), 1200);
      } catch (e) { setStatus('⚠ No se pudo guardar', 'err'); }
      finally { busy[id] = false; document.getElementById('add-' + id).disabled = false; document.getElementById('sub-' + id).disabled = false; }
    }
    async function deleteMove(id, key) {
      if (busy[id]) return; busy[id] = true;
      try { const res = await fetch(DB + '/moves/' + id + '/' + key + '.json', { method: 'DELETE' }); if (!res.ok) throw new Error('HTTP ' + res.status); await fetchMoves(); }
      catch (e) { setStatus('⚠ No se pudo eliminar', 'err'); } finally { busy[id] = false; }
    }

    // ---------- Objetivo personal ----------
    function editGoal(id) {
      const v = prompt('Objetivo de la caja fuerte de ' + nameOf(id) + ' (€):', goalOf(id));
      if (v === null) return;
      const n = parseFloat(String(v).replace(/\./g, '').replace(',', '.'));
      if (!(n > 0)) { setStatus('⚠ Objetivo inválido', 'err'); setTimeout(() => setStatus('', ''), 1500); return; }
      setGoal(id, Math.round(n));
    }
    async function setGoal(id, val) {
      try {
        const res = await fetch(DB + '/goals/' + id + '.json', { method: 'PUT', body: JSON.stringify(val) });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        await fetchGoals();
        setStatus('Objetivo actualizado ✓', 'ok'); setTimeout(() => setStatus('', ''), 1200);
      } catch (e) { setStatus('⚠ No se pudo guardar el objetivo', 'err'); }
    }

    // ---------- Generado (solo recibido, NO suma a la caja fuerte) ----------
    async function addGenerated(id) {
      const bkey = 'gen-' + id; if (busy[bkey]) return;
      const input = document.getElementById('genin-' + id);
      const amount = parseFloat(input.value);
      if (!amount || amount <= 0) { shake(input); return; }
      busy[bkey] = true; setStatus('Guardando…', '');
      try {
        const res = await fetch(DB + '/generated/' + id + '.json', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: Math.round(amount * 100) / 100, day: ymd(new Date()) })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        // En Andrés, lo generado también descuenta del dinero pendiente (sin bajar de 0)
        if (id === 'andres') {
          const { pending } = classicTotals();
          const sub = Math.round(Math.min(Math.round(amount * 100) / 100, Math.max(0, pending)) * 100) / 100;
          if (sub > 0) {
            await fetch(DB + '/classic.json', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ type: 'pending', amount: -sub })
            });
          }
        }
        input.value = ''; await fetchGenerated(); await fetchClassic(true);
        setStatus('Generado guardado ✓', 'ok'); setTimeout(() => setStatus('', ''), 1200);
      } catch (e) { setStatus('⚠ No se pudo guardar', 'err'); }
      finally { busy[bkey] = false; }
    }
    async function deleteGenerated(id, key) {
      const bkey = 'gen-' + id; if (busy[bkey]) return; busy[bkey] = true;
      try { const res = await fetch(DB + '/generated/' + id + '/' + key + '.json', { method: 'DELETE' }); if (!res.ok) throw new Error('HTTP ' + res.status); await fetchGenerated(); }
      catch (e) { setStatus('⚠ No se pudo eliminar', 'err'); } finally { busy[bkey] = false; }
    }

    // ---------- Trading (Julián y Jorge) ----------
    async function setTrading(id) {
      const bkey = 'tr-' + id; if (busy[bkey]) return;
      const input = document.getElementById('trin-' + id);
      const raw = parseFloat(input.value);
      if (isNaN(raw)) { shake(input); return; }
      const t = trading[id] || {};
      if (t.funded) { setStatus('Cuenta ya fondeada ✅', 'ok'); setTimeout(() => setStatus('', ''), 1500); return; }
      const phase = Number(t.phase || 1);
      const target = PHASE_TARGET[phase] || 8;
      const pct = Math.round(Math.max(TR_MIN, Math.min(target, raw)) * 100) / 100;
      const day = ymd(new Date());
      const post = (obj) => fetch(DB + '/trading/' + id + '/log.json', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) });
      const put = (path, v) => fetch(DB + '/trading/' + id + '/' + path + '.json', { method: 'PUT', body: JSON.stringify(v) });
      busy[bkey] = true; setStatus('Guardando…', '');
      try {
        await post({ pct, phase, day });
        if (pct >= target) {                 // objetivo alcanzado → pasa de fase
          await post({ pass: phase, day });
          if (phase === 1) { await put('phase', 2); await put('current', 0); }
          else { await put('funded', true); await put('current', target); await post({ funded: true, day }); }
        } else {
          await put('current', pct);
        }
        input.value = ''; await fetchTrading();
        setStatus(pct >= target ? '¡Fase superada! ✅' : 'Registrado ✓', 'ok'); setTimeout(() => setStatus('', ''), 1400);
      } catch (e) { setStatus('⚠ No se pudo guardar', 'err'); }
      finally { busy[bkey] = false; }
    }
    async function burnTrading(id) {
      const bkey = 'tr-' + id; if (busy[bkey]) return;
      if (!confirm('¿Marcar la cuenta de ' + nameOf(id) + ' como quemada y reiniciar a Fase 1 (0%)?')) return;
      busy[bkey] = true; setStatus('Reiniciando…', '');
      try {
        await fetch(DB + '/trading/' + id + '/current.json', { method: 'PUT', body: JSON.stringify(0) });
        await fetch(DB + '/trading/' + id + '/phase.json', { method: 'PUT', body: JSON.stringify(1) });
        await fetch(DB + '/trading/' + id + '/funded.json', { method: 'PUT', body: JSON.stringify(false) });
        await fetch(DB + '/trading/' + id + '/log.json', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ burned: true, day: ymd(new Date()) }) });
        await fetchTrading();
        setStatus('Cuenta reiniciada 🔥', 'ok'); setTimeout(() => setStatus('', ''), 1500);
      } catch (e) { setStatus('⚠ No se pudo reiniciar', 'err'); }
      finally { busy[bkey] = false; }
    }
    async function deleteTradingLog(id, key) {
      const bkey = 'tr-' + id; if (busy[bkey]) return; busy[bkey] = true;
      try { const res = await fetch(DB + '/trading/' + id + '/log/' + key + '.json', { method: 'DELETE' }); if (!res.ok) throw new Error('HTTP ' + res.status); await fetchTrading(); }
      catch (e) { setStatus('⚠ No se pudo eliminar', 'err'); } finally { busy[bkey] = false; }
    }

    // ---------- Lista de la compra (compra 1 / compra 2) ----------
    let shopping = {};
    let shopCurrent = 'compra1';
    const SHOP_NAMES = { compra1: 'Compra 1', compra2: 'Compra 2' };
    const escHtml = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    async function fetchShopping() {
      try {
        const res = await fetch(DB + '/shopping.json', { cache: 'no-store' });
        if (!res.ok) return;
        shopping = (await res.json()) || {};
        renderShopCounts();
        const m = document.getElementById('shop-modal');
        if (m && !m.hidden) renderShop();
      } catch (e) {}
    }
    function renderShopCounts() {
      ['compra1', 'compra2'].forEach(id => {
        const el = document.getElementById('shopn-' + id); if (!el) return;
        const items = shopping[id] || {};
        const pend = Object.keys(items).filter(k => !items[k].done).length;
        el.textContent = pend ? ' (' + pend + ')' : '';
      });
    }
    function openShop(id) {
      shopCurrent = id;
      document.getElementById('shop-title').textContent = SHOP_NAMES[id] + ' · alimentos a comprar';
      document.getElementById('shop-modal').hidden = false;
      renderShop();
      setTimeout(() => { const i = document.getElementById('shop-input'); if (i) i.focus(); }, 50);
    }
    function closeShop() { document.getElementById('shop-modal').hidden = true; }
    function renderShop() {
      const items = shopping[shopCurrent] || {};
      const keys = Object.keys(items).sort();
      const el = document.getElementById('shop-list'); if (!el) return;
      el.innerHTML = keys.length === 0 ? '<div class="shop-empty">Sin alimentos aún</div>' : keys.map(k => {
        const it = items[k] || {}; const done = !!it.done;
        return `<div class="shop-item ${done ? 'done' : ''}">
          <input class="chk" type="checkbox" ${done ? 'checked' : ''} onchange="toggleShopItem('${k}', this.checked)">
          <span class="nm">${escHtml(it.name)}</span>
          <button class="x" onclick="deleteShopItem('${k}')" title="Eliminar">×</button>
        </div>`;
      }).join('');
    }
    async function addShopItem() {
      const input = document.getElementById('shop-input');
      const name = (input.value || '').trim();
      if (!name) { shake(input); return; }
      try {
        const res = await fetch(DB + '/shopping/' + shopCurrent + '.json', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, done: false })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        input.value = ''; await fetchShopping(); input.focus();
      } catch (e) { setStatus('⚠ No se pudo guardar', 'err'); }
    }
    async function toggleShopItem(key, done) {
      try { await fetch(DB + '/shopping/' + shopCurrent + '/' + key + '/done.json', { method: 'PUT', body: JSON.stringify(!!done) }); await fetchShopping(); } catch (e) {}
    }
    async function deleteShopItem(key) {
      try { await fetch(DB + '/shopping/' + shopCurrent + '/' + key + '.json', { method: 'DELETE' }); await fetchShopping(); } catch (e) {}
    }

    // ---------- Foto ----------
    function pickPhoto(id) { document.getElementById('file-' + id).click(); }
    function handlePhoto(id, inputEl) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = async () => {
          const size = 256;
          const side = Math.min(img.width, img.height);
          const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
          const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
          canvas.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, size, size);
          const dataURL = canvas.toDataURL('image/jpeg', 0.85);
          photos[id] = dataURL; renderPhoto(id);
          setStatus('Subiendo foto…', '');
          try {
            const res = await fetch(DB + '/photos/' + id + '.json', { method: 'PUT', body: JSON.stringify(dataURL) });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            setStatus('Foto guardada ✓', 'ok'); setTimeout(() => setStatus('', ''), 1200);
          } catch (e) { setStatus('⚠ No se pudo subir la foto', 'err'); }
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file); inputEl.value = '';
    }

    // ====== RETO 500€ (NO TOCAR) ======
    function classicTotals() {
      let received = 0, pending = 0;
      Object.keys(classic).forEach(k => {
        const e = classic[k]; const a = Number(e.amount || 0);
        if (e.type === 'received') received += a; else if (e.type === 'pending') pending += a;
      });
      return { received, pending };
    }

    // Total "Generado" del mes en curso (la barra verde del tablero de Andrés)
    function genMonthTotal(id) {
      const g = generated[id] || {};
      const pref = ymd(new Date()).slice(0, 7);
      let s = 0;
      Object.keys(g).forEach(k => { const e = g[k]; if (e && e.day && String(e.day).slice(0, 7) === pref) s += Number(e.amount || 0); });
      return s;
    }

    function renderClassic() {
      if (!document.getElementById('cbar-green')) return;
      const { pending } = classicTotals();
      const received = genMonthTotal('andres');
      const total = received + pending;
      const pctGreen = Math.min((received / GOAL_CLASSIC) * 100, 100);
      const pctGray  = Math.min((pending  / GOAL_CLASSIC) * 100, Math.max(0, 100 - pctGreen));
      const pctTotal = Math.min((total    / GOAL_CLASSIC) * 100, 100);

      document.getElementById('cbar-green').style.width = pctGreen + '%';
      document.getElementById('cbar-gray').style.width  = pctGray + '%';
      document.getElementById('cbar-pct').textContent   = Math.round(pctTotal) + '%';
      document.getElementById('c-received').textContent = fmt(received) + '€';
      document.getElementById('c-pending').textContent  = fmt(pending) + '€';
      document.getElementById('c-left').textContent     = fmt(Math.max(0, GOAL_CLASSIC - total)) + '€';

      // Indicadores 60/340/370/470 (comida, alquiler, servicios, reinversión): verde si lo cubre lo generado del mes, amarillo si lo cubre lo pendiente, rojo si no se llega
      [30, 310, 340, 370, 470].forEach(T => {
        const cls = received >= T ? 's-green' : (total >= T ? 's-yellow' : 's-red');
        const mk = document.getElementById('cmark-' + T);
        const lg = document.getElementById('cleg-' + T);
        if (mk) mk.className = 'cbar-mark ' + cls;
        if (lg) { lg.classList.remove('s-red', 's-yellow', 's-green'); lg.classList.add(cls); }
      });
    }

    // Historial diario SOLO de "dinero pendiente": un cuadrado por día desde el 5-jun
    function renderPendingDays() {
      const byDay = {};
      Object.keys(classic).forEach(k => {
        const e = classic[k];
        if (e.type === 'pending' && e.day && Number(e.amount || 0) > 0) byDay[e.day] = (byDay[e.day] || 0) + Number(e.amount || 0);
      });
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const todayStr = ymd(today);
      const days = [];
      const cur = new Date(START_PENDING); cur.setHours(0, 0, 0, 0);
      while (cur <= today) { days.push(ymd(cur)); cur.setDate(cur.getDate() + 1); }
      days.reverse();
      const grid = document.getElementById('day-grid');
      if (!grid) return;
      // Solo se muestran días con ingreso (>0) o el día de hoy; los días vacíos no generan casilla
      const shown = days.filter(ds => (byDay[ds] || 0) > 0 || ds === todayStr);
      grid.innerHTML = (shown.length ? shown : [todayStr]).map(ds => {
        const label = dayLabel(ds);
        const amt = byDay[ds] || 0;
        const isToday = ds === todayStr;
        return `<div class="day-sq ${amt !== 0 ? '' : 'empty'} ${isToday ? 'today' : ''}">
          <span class="d">${label}${isToday ? ' · hoy' : ''}</span>
          <span class="m">${fmt(amt)}€</span>
        </div>`;
      }).join('');
    }

    async function fetchClassic(silent) {
      try {
        const res = await fetch(DB + '/classic.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        classic = (await res.json()) || {};
        renderClassic(); renderPendingDays(); setStatus('', '');
      } catch (e) { if (!silent) setStatus('⚠ No se pudo conectar con la base de datos', 'err'); }
    }

    async function addClassic(type, sign) {
      const bkey = 'classic-' + type;
      if (busy[bkey]) return;
      const input = document.getElementById('cin-' + type);
      let amount = parseFloat(input.value);
      if (!amount || amount <= 0) { shake(input); return; }
      if (sign < 0) {
        const tot = type === 'received' ? classicTotals().received : classicTotals().pending;
        amount = Math.min(amount, tot);
        if (amount <= 0) { input.value = ''; return; }
      }
      const value = sign < 0 ? -amount : amount;
      busy[bkey] = true;
      document.getElementById('cadd-' + type).disabled = true; document.getElementById('csub-' + type).disabled = true;
      setStatus('Guardando…', '');
      try {
        const res = await fetch(DB + '/classic.json', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type, amount: Math.round(value * 100) / 100, day: ymd(new Date()) })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        input.value = ''; await fetchClassic();
        setStatus('Guardado ✓', 'ok'); setTimeout(() => setStatus('', ''), 1200);
      } catch (e) { setStatus('⚠ No se pudo guardar', 'err'); }
      finally { busy[bkey] = false; document.getElementById('cadd-' + type).disabled = false; document.getElementById('csub-' + type).disabled = false; }
    }

    async function deleteClassic(key) {
      if (busy['classic-del']) return; busy['classic-del'] = true;
      try {
        const res = await fetch(DB + '/classic/' + key + '.json', { method: 'DELETE' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        await fetchClassic();
      } catch (e) { setStatus('⚠ No se pudo eliminar', 'err'); }
      finally { busy['classic-del'] = false; }
    }

    // ---------- Init ----------
    buildCards();
    PEOPLE.forEach(p => {
      document.getElementById('input-' + p.id).addEventListener('keydown', e => { if (e.key === 'Enter') addMove(p.id, 1); });
      document.getElementById('genin-' + p.id).addEventListener('keydown', e => { if (e.key === 'Enter') addGenerated(p.id); });
    });
    TRADERS.forEach(id => { document.getElementById('trin-' + id).addEventListener('keydown', e => { if (e.key === 'Enter') setTrading(id); }); });
    document.getElementById('cin-pending').addEventListener('keydown', e => { if (e.key === 'Enter') addClassic('pending', 1); });

    document.getElementById('shop-input').addEventListener('keydown', e => { if (e.key === 'Enter') addShopItem(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeShop(); });

    function refreshAll(silent) { fetchMoves(silent); fetchGoals(); fetchGenerated(); fetchTrading(); fetchClassic(true); fetchShopping(); }
    refreshAll(false);
    fetchPhotos();
    setInterval(() => refreshAll(true), 6000);
    setInterval(fetchPhotos, 60000);
    window.addEventListener('focus', () => { refreshAll(true); fetchPhotos(); });
  </script>
</body>
