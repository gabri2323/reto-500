<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reto comprar una casa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f13;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    .container { width: 100%; max-width: 920px; }

    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-size: 2.3rem; font-weight: 700; letter-spacing: -0.5px; color: #fff; }
    header h1 span { color: #4ade80; }
    header p { margin-top: 6px; color: #6b6b80; font-size: 0.95rem; }
    .conn-status { min-height: 18px; margin-top: 10px; font-size: 0.8rem; color: #6b6b80; text-align: center; transition: color .2s; }
    .conn-status.err { color: #ef4444; }
    .conn-status.ok  { color: #4ade80; }

    /* TOTAL */
    .total-section {
      background: #1a1a24; border: 1px solid #2a2a38; border-radius: 20px;
      padding: 28px 32px; margin-bottom: 28px;
    }
    .total-labels { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; flex-wrap: wrap; gap: 6px; }
    .total-amount { font-size: 2.1rem; font-weight: 700; color: #fff; }
    .total-amount .unit { font-size: 1.1rem; color: #6b6b80; margin-left: 2px; }
    .total-goal { font-size: 0.95rem; color: #6b6b80; }
    .total-goal strong { color: #a0a0b8; }
    .bar-wrapper { background: #2a2a38; border-radius: 999px; height: 30px; overflow: hidden; position: relative; }
    .bar-green { background: linear-gradient(90deg, #16a34a, #4ade80); height: 100%; width: 0%; transition: width .5s cubic-bezier(.4,0,.2,1); }
    .bar-percent { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: .82rem; font-weight: 600; color: rgba(255,255,255,.6); pointer-events: none; }
    .total-left { margin-top: 12px; font-size: .9rem; color: #6b6b80; text-align: right; }
    .total-left strong { color: #4ade80; }

    /* PARTICIPANTS GRID */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }

    .card {
      background: #1a1a24; border: 1px solid #2a2a38; border-radius: 18px;
      padding: 20px; display: flex; flex-direction: column; gap: 14px;
    }
    .card-head { display: flex; align-items: center; gap: 14px; }
    .avatar {
      width: 58px; height: 58px; border-radius: 50%; flex-shrink: 0; cursor: pointer;
      object-fit: cover; border: 2px solid #2a2a38; background-size: cover; background-position: center;
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.3rem;
      color: #0f0f13; position: relative; transition: border-color .2s; user-select: none;
    }
    .avatar:hover { border-color: #4ade80; }
    .avatar .cam {
      position: absolute; bottom: -2px; right: -2px; width: 20px; height: 20px; border-radius: 50%;
      background: #4ade80; color: #052e16; font-size: 11px; display: flex; align-items: center; justify-content: center;
      border: 2px solid #1a1a24;
    }
    .card-head .who { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .card-head .name { font-size: 1.05rem; font-weight: 700; color: #fff; }
    .card-head .amount { font-size: 1.35rem; font-weight: 700; color: #4ade80; }

    .mini-bar { background: #2a2a38; border-radius: 999px; height: 10px; overflow: hidden; }
    .mini-fill { background: linear-gradient(90deg, #16a34a, #4ade80); height: 100%; width: 0%; transition: width .5s cubic-bezier(.4,0,.2,1); }
    .mini-pct { font-size: .72rem; color: #6b6b80; }

    .input-row { display: flex; gap: 6px; }
    .input-row input {
      flex: 1; background: #0f0f13; border: 1px solid #2a2a38; border-radius: 10px; color: #fff;
      font-size: .95rem; padding: 9px 12px; outline: none; transition: border-color .2s; min-width: 0;
    }
    .input-row input:focus { border-color: #4ade80; }
    .input-row input::placeholder { color: #3a3a50; }
    .input-row input.error { border-color: #ef4444 !important; animation: shake .35s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }

    .btn { border: none; border-radius: 10px; font-size: 1.05rem; font-weight: 700; cursor: pointer; padding: 9px 14px; transition: opacity .15s, transform .1s; }
    .btn:active { transform: scale(.94); }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .45; cursor: default; transform: none; }
    .btn-add { background: #4ade80; color: #052e16; }
    .btn-sub { background: #3a3a48; color: #fff; }

    .hist { display: flex; flex-direction: column; gap: 5px; max-height: 132px; overflow-y: auto; padding-right: 2px; }
    .hist::-webkit-scrollbar { width: 4px; }
    .hist::-webkit-scrollbar-thumb { background: #2a2a38; border-radius: 4px; }
    .hist-empty { font-size: .8rem; color: #3a3a50; text-align: center; padding: 6px 0; }
    .move {
      display: flex; align-items: center; justify-content: space-between;
      background: #22222e; border-radius: 8px; padding: 6px 10px; font-size: .85rem; animation: fadeIn .2s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
    .move .val { font-weight: 700; }
    .move .val.up { color: #4ade80; }
    .move .val.down { color: #f59e0b; }
    .move .del { background: none; border: none; color: #3a3a50; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 0 0 8px; transition: color .15s; }
    .move .del:hover { color: #ef4444; }

    footer { margin-top: 30px; text-align: center; color: #3a3a50; font-size: .8rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Reto <span>comprar una casa</span></h1>
      <p>Meta común entre los 5 — cualquiera con el link puede actualizar su tablero</p>
      <div class="conn-status" id="conn-status"></div>
    </header>

    <div class="total-section">
      <div class="total-labels">
        <div class="total-amount" id="total-amount">0<span class="unit">€</span></div>
        <div class="total-goal">Meta: <strong>300.000€</strong></div>
      </div>
      <div class="bar-wrapper">
        <div class="bar-green" id="total-bar"></div>
        <span class="bar-percent" id="total-pct">0%</span>
      </div>
      <div class="total-left">Faltan <strong id="total-left">300.000€</strong></div>
    </div>

    <div class="grid" id="grid"></div>

    <footer>Reto comprar una casa · objetivo 300.000€ · datos compartidos en tiempo real</footer>
  </div>

  <script>
    const GOAL = 300000;
    const DB = 'https://reto-500-default-rtdb.firebaseio.com';
    const PEOPLE = [
      { id: 'andres', name: 'Andrés', color: '#4ade80' },
      { id: 'julian', name: 'Julián', color: '#60a5fa' },
      { id: 'jorge',  name: 'Jorge',  color: '#f472b6' },
      { id: 'jose',   name: 'José',   color: '#fbbf24' },
      { id: 'arturo', name: 'Arturo', color: '#a78bfa' }
    ];

    let moves = {};   // { id: { key: {amount} } }
    let photos = {};  // { id: dataURL }
    const busy = {};

    const fmt = n => Number(n || 0).toLocaleString('es-ES', { maximumFractionDigits: 2 });

    function setStatus(text, kind) {
      const el = document.getElementById('conn-status');
      el.textContent = text || '';
      el.className = 'conn-status' + (kind ? ' ' + kind : '');
    }

    function personTotal(id) {
      const m = moves[id] || {};
      return Object.keys(m).reduce((s, k) => s + Number(m[k].amount || 0), 0);
    }

    function buildCards() {
      const grid = document.getElementById('grid');
      grid.innerHTML = PEOPLE.map(p => `
        <div class="card">
          <div class="card-head">
            <div class="avatar" id="avatar-${p.id}" style="background:${p.color}" onclick="pickPhoto('${p.id}')" title="Cambiar foto">
              <span id="avatar-letter-${p.id}">${p.name[0]}</span>
              <span class="cam">+</span>
            </div>
            <input type="file" id="file-${p.id}" accept="image/*" style="display:none" onchange="handlePhoto('${p.id}', this)">
            <div class="who">
              <span class="name">${p.name}</span>
              <span class="amount" id="amount-${p.id}">0€</span>
            </div>
          </div>

          <div>
            <div class="mini-bar"><div class="mini-fill" id="fill-${p.id}"></div></div>
            <div class="mini-pct" id="pct-${p.id}">0% de 300.000€</div>
          </div>

          <div class="input-row">
            <input id="input-${p.id}" type="number" min="0" step="0.01" placeholder="€ importe">
            <button class="btn btn-sub" id="sub-${p.id}" onclick="addMove('${p.id}', -1)" title="Restar">−</button>
            <button class="btn btn-add" id="add-${p.id}" onclick="addMove('${p.id}', 1)" title="Sumar">+</button>
          </div>

          <div class="hist" id="hist-${p.id}"></div>
        </div>
      `).join('');
    }

    function renderPhoto(id) {
      const av = document.getElementById('avatar-' + id);
      const letter = document.getElementById('avatar-letter-' + id);
      if (!av) return;
      if (photos[id]) {
        av.style.backgroundImage = 'url(' + photos[id] + ')';
        if (letter) letter.style.display = 'none';
      } else {
        av.style.backgroundImage = '';
        if (letter) letter.style.display = '';
      }
    }

    function render() {
      let total = 0;
      PEOPLE.forEach(p => {
        const t = personTotal(p.id);
        total += t;
        const pct = Math.min((t / GOAL) * 100, 100);
        document.getElementById('amount-' + p.id).textContent = fmt(t) + '€';
        document.getElementById('fill-' + p.id).style.width = pct + '%';
        document.getElementById('pct-' + p.id).textContent = (pct < 1 && t > 0 ? pct.toFixed(1) : Math.round(pct)) + '% de 300.000€';

        const m = moves[p.id] || {};
        const keys = Object.keys(m).sort((a, b) => (a < b ? 1 : -1));
        const hist = document.getElementById('hist-' + p.id);
        if (keys.length === 0) {
          hist.innerHTML = '<div class="hist-empty">Sin movimientos</div>';
        } else {
          hist.innerHTML = keys.map(k => {
            const a = Number(m[k].amount || 0);
            const up = a >= 0;
            return `<div class="move">
              <span class="val ${up ? 'up' : 'down'}">${up ? '+' : '−'}${fmt(Math.abs(a))}€</span>
              <button class="del" onclick="deleteMove('${p.id}','${k}')" title="Eliminar">×</button>
            </div>`;
          }).join('');
        }
      });

      const pctTotal = Math.min((total / GOAL) * 100, 100);
      document.getElementById('total-amount').innerHTML = fmt(total) + '<span class="unit">€</span>';
      document.getElementById('total-bar').style.width = pctTotal + '%';
      document.getElementById('total-pct').textContent = (pctTotal < 1 && total > 0 ? pctTotal.toFixed(2) : Math.round(pctTotal)) + '%';
      document.getElementById('total-left').textContent = fmt(Math.max(0, GOAL - total)) + '€';
    }

    async function fetchMoves(silent) {
      try {
        const res = await fetch(DB + '/moves.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        moves = (await res.json()) || {};
        render();
        setStatus('', '');
      } catch (e) {
        if (!silent) setStatus('⚠ No se pudo conectar con la base de datos', 'err');
      }
    }

    async function fetchPhotos() {
      try {
        const res = await fetch(DB + '/photos.json', { cache: 'no-store' });
        if (!res.ok) return;
        photos = (await res.json()) || {};
        PEOPLE.forEach(p => renderPhoto(p.id));
      } catch (e) {}
    }

    async function addMove(id, sign) {
      if (busy[id]) return;
      const input = document.getElementById('input-' + id);
      let amount = parseFloat(input.value);
      if (!amount || amount <= 0) {
        input.classList.remove('error'); void input.offsetWidth; input.classList.add('error');
        input.focus(); setTimeout(() => input.classList.remove('error'), 600); return;
      }
      if (sign < 0) {
        const t = personTotal(id);
        amount = Math.min(amount, t);
        if (amount <= 0) { input.value = ''; return; }
      }
      const value = sign < 0 ? -amount : amount;
      busy[id] = true;
      document.getElementById('add-' + id).disabled = true;
      document.getElementById('sub-' + id).disabled = true;
      setStatus('Guardando…', '');
      try {
        const res = await fetch(DB + '/moves/' + id + '.json', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: Math.round(value * 100) / 100 })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        input.value = '';
        await fetchMoves();
        setStatus('Guardado ✓', 'ok'); setTimeout(() => setStatus('', ''), 1200);
      } catch (e) {
        setStatus('⚠ No se pudo guardar', 'err');
      } finally {
        busy[id] = false;
        document.getElementById('add-' + id).disabled = false;
        document.getElementById('sub-' + id).disabled = false;
      }
    }

    async function deleteMove(id, key) {
      if (busy[id]) return;
      busy[id] = true;
      try {
        const res = await fetch(DB + '/moves/' + id + '/' + key + '.json', { method: 'DELETE' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        await fetchMoves();
      } catch (e) {
        setStatus('⚠ No se pudo eliminar', 'err');
      } finally {
        busy[id] = false;
      }
    }

    function pickPhoto(id) { document.getElementById('file-' + id).click(); }

    function handlePhoto(id, inputEl) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = async () => {
          const max = 256;
          let { width, height } = img;
          if (width > height && width > max) { height = height * max / width; width = max; }
          else if (height > max) { width = width * max / height; height = max; }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          const dataURL = canvas.toDataURL('image/jpeg', 0.7);
          photos[id] = dataURL; renderPhoto(id);
          setStatus('Subiendo foto…', '');
          try {
            const res = await fetch(DB + '/photos/' + id + '.json', { method: 'PUT', body: JSON.stringify(dataURL) });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            setStatus('Foto guardada ✓', 'ok'); setTimeout(() => setStatus('', ''), 1200);
          } catch (e) {
            setStatus('⚠ No se pudo subir la foto', 'err');
          }
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
      inputEl.value = '';
    }

    buildCards();
    PEOPLE.forEach(p => {
      document.getElementById('input-' + p.id).addEventListener('keydown', e => { if (e.key === 'Enter') addMove(p.id, 1); });
    });
    fetchMoves();
    fetchPhotos();
    setInterval(() => fetchMoves(true), 6000);
    setInterval(fetchPhotos, 60000);
    window.addEventListener('focus', () => { fetchMoves(true); fetchPhotos(); });
  </script>
</body>
</html>
