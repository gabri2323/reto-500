<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reto 500€</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f13;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container { width: 100%; max-width: 680px; }

    header { text-align: center; margin-bottom: 40px; }
    header h1 { font-size: 2.4rem; font-weight: 700; letter-spacing: -0.5px; color: #fff; }
    header h1 span { color: #4ade80; }
    header p { margin-top: 6px; color: #6b6b80; font-size: 0.95rem; }

    .conn-status {
      min-height: 18px; margin-top: 10px; font-size: 0.8rem;
      color: #6b6b80; text-align: center; transition: color 0.2s;
    }
    .conn-status.err { color: #ef4444; }
    .conn-status.ok  { color: #4ade80; }

    .progress-section {
      background: #1a1a24; border: 1px solid #2a2a38;
      border-radius: 20px; padding: 32px; margin-bottom: 24px;
    }

    .progress-labels { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; }
    .progress-total { font-size: 2rem; font-weight: 700; color: #fff; }
    .progress-total .unit { font-size: 1.1rem; color: #6b6b80; margin-left: 2px; }
    .progress-goal { font-size: 0.9rem; color: #6b6b80; }
    .progress-goal strong { color: #a0a0b8; }

    .bar-wrapper {
      background: #2a2a38; border-radius: 999px; height: 28px;
      overflow: hidden; position: relative;
    }
    .bar-fill { height: 100%; display: flex; border-radius: 999px; overflow: hidden; min-width: 0; }
    .bar-green {
      background: linear-gradient(90deg, #16a34a, #4ade80); height: 100%;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); min-width: 0;
    }
    .bar-gray {
      background: linear-gradient(90deg, #52525b, #a1a1aa); height: 100%;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); min-width: 0;
    }
    .bar-percent {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      font-size: 0.8rem; font-weight: 600; color: rgba(255,255,255,0.5); pointer-events: none;
    }

    .stats-row { display: flex; gap: 12px; margin-top: 20px; }
    .stat {
      flex: 1; background: #22222e; border-radius: 12px; padding: 14px 16px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: #6b6b80; }
    .stat-value { font-size: 1.25rem; font-weight: 700; }
    .stat-value.green { color: #4ade80; }
    .stat-value.gray  { color: #a1a1aa; }
    .stat-value.white { color: #fff; }

    .add-section { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .add-card { background: #1a1a24; border: 1px solid #2a2a38; border-radius: 20px; padding: 24px; }
    .add-card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot.green { background: #4ade80; }
    .dot.gray  { background: #a1a1aa; }
    .add-card p { font-size: 0.8rem; color: #6b6b80; margin-bottom: 16px; }

    .input-row { display: flex; gap: 8px; }
    .input-row input {
      flex: 1; background: #0f0f13; border: 1px solid #2a2a38; border-radius: 10px;
      color: #fff; font-size: 1rem; padding: 10px 14px; outline: none;
      transition: border-color 0.2s; min-width: 0;
    }
    .input-row input:focus { border-color: #4ade80; }
    .input-row input::placeholder { color: #3a3a50; }
    .input-row input.error { border-color: #ef4444 !important; animation: shake 0.35s ease; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .btn {
      padding: 10px 16px; border: none; border-radius: 10px; font-size: 1rem;
      font-weight: 600; cursor: pointer; transition: opacity 0.15s, transform 0.1s; white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }
    .btn:hover  { opacity: 0.85; }
    .btn:disabled { opacity: 0.45; cursor: default; transform: none; }
    .btn-green { background: #4ade80; color: #052e16; }
    .btn-gray  { background: #a1a1aa; color: #09090b; }

    .transactions { background: #1a1a24; border: 1px solid #2a2a38; border-radius: 20px; padding: 24px; }
    .transactions h3 { font-size: 1rem; font-weight: 600; color: #a0a0b8; margin-bottom: 16px; }

    #tx-list { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; padding-right: 4px; }
    #tx-list::-webkit-scrollbar { width: 4px; }
    #tx-list::-webkit-scrollbar-track { background: transparent; }
    #tx-list::-webkit-scrollbar-thumb { background: #2a2a38; border-radius: 4px; }

    .tx-item {
      display: flex; align-items: center; justify-content: space-between;
      background: #22222e; border-radius: 10px; padding: 12px 16px; animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .tx-left { display: flex; align-items: center; gap: 10px; }
    .tx-icon { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .tx-desc { font-size: 0.9rem; color: #c0c0d0; }
    .tx-amount { font-size: 1rem; font-weight: 700; }
    .tx-amount.green { color: #4ade80; }
    .tx-amount.gray  { color: #a1a1aa; }
    .tx-delete {
      background: none; border: none; color: #3a3a50; cursor: pointer;
      font-size: 1.1rem; padding: 0 0 0 12px; line-height: 1; transition: color 0.15s;
    }
    .tx-delete:hover { color: #ef4444; }

    .empty-state { text-align: center; color: #3a3a50; font-size: 0.9rem; padding: 20px 0; }

    @media (max-width: 480px) {
      .add-section { grid-template-columns: 1fr; }
      .stats-row { flex-wrap: wrap; }
      .stat { min-width: calc(50% - 6px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Reto <span>500€</span> / mes</h1>
      <p>Objetivo compartido — cualquiera con el link puede añadir</p>
      <div class="conn-status" id="conn-status"></div>
    </header>

    <div class="progress-section">
      <div class="progress-labels">
        <div><span class="progress-total" id="total-display">0<span class="unit">€</span></span></div>
        <div class="progress-goal">Objetivo: <strong>500€</strong></div>
      </div>

      <div class="bar-wrapper">
        <div class="bar-fill" id="bar-fill">
          <div class="bar-green" id="bar-green" style="width:0%"></div>
          <div class="bar-gray"  id="bar-gray"  style="width:0%"></div>
        </div>
        <span class="bar-percent" id="bar-percent">0%</span>
      </div>

      <div class="stats-row">
        <div class="stat"><span class="stat-label">Recibido</span><span class="stat-value green" id="stat-green">0€</span></div>
        <div class="stat"><span class="stat-label">Pendiente</span><span class="stat-value gray" id="stat-gray">0€</span></div>
        <div class="stat"><span class="stat-label">Restante</span><span class="stat-value white" id="stat-left">500€</span></div>
      </div>
    </div>

    <div class="add-section">
      <div class="add-card">
        <h3><span class="dot green"></span>Dinero recibido</h3>
        <p>Cobrado y en tu cuenta</p>
        <div class="input-row">
          <input id="input-green" type="number" min="0" step="0.01" placeholder="€ importe">
          <button class="btn btn-green" id="btn-green" onclick="addMoney('received')">+</button>
        </div>
      </div>

      <div class="add-card">
        <h3><span class="dot gray"></span>Dinero pendiente</h3>
        <p>Acordado pero no cobrado aún</p>
        <div class="input-row">
          <input id="input-gray" type="number" min="0" step="0.01" placeholder="€ importe">
          <button class="btn btn-gray" id="btn-gray" onclick="addMoney('pending')">+</button>
        </div>
      </div>
    </div>

    <div class="transactions">
      <h3>Historial</h3>
      <div id="tx-list"><p class="empty-state">Cargando…</p></div>
    </div>
  </div>

  <script>
    const GOAL = 500;
    // Base de datos compartida (Firebase Realtime Database)
    const DB = 'https://reto-500-default-rtdb.firebaseio.com';
    const ENTRIES_URL = DB + '/entries.json';

    let entries = [];
    let busy = false;

    const fmt = n => Number(n).toFixed(2).replace('.00', '');

    function setStatus(text, kind) {
      const el = document.getElementById('conn-status');
      el.textContent = text || '';
      el.className = 'conn-status' + (kind ? ' ' + kind : '');
    }

    function setBusy(state) {
      busy = state;
      document.getElementById('btn-green').disabled = state;
      document.getElementById('btn-gray').disabled  = state;
    }

    async function load(silent) {
      try {
        const res = await fetch(ENTRIES_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        entries = data
          ? Object.keys(data).map(k => ({ id: k, type: data[k].type, amount: data[k].amount }))
              .sort((a, b) => (a.id < b.id ? 1 : -1))
          : [];
        render();
        setStatus('', '');
      } catch (e) {
        if (!silent) setStatus('⚠ No se pudo conectar con la base de datos', 'err');
      }
    }

    async function addMoney(type) {
      if (busy) return;
      const input = document.getElementById(type === 'received' ? 'input-green' : 'input-gray');
      const amount = parseFloat(input.value);
      if (!amount || amount <= 0) {
        input.classList.remove('error');
        void input.offsetWidth;
        input.classList.add('error');
        input.focus();
        setTimeout(() => input.classList.remove('error'), 600);
        return;
      }
      setBusy(true);
      setStatus('Guardando…', '');
      try {
        const res = await fetch(ENTRIES_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type, amount: Math.round(amount * 100) / 100 })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        input.value = '';
        await load();
        setStatus('Guardado ✓', 'ok');
        setTimeout(() => setStatus('', ''), 1500);
      } catch (e) {
        setStatus('⚠ No se pudo guardar. Revisa tu conexión.', 'err');
      } finally {
        setBusy(false);
      }
    }

    async function deleteMoney(id) {
      if (busy) return;
      setBusy(true);
      try {
        const res = await fetch(DB + '/entries/' + id + '.json', { method: 'DELETE' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        await load();
        setStatus('', '');
      } catch (e) {
        setStatus('⚠ No se pudo eliminar.', 'err');
      } finally {
        setBusy(false);
      }
    }

    function render() {
      const received = entries.filter(e => e.type === 'received').reduce((s, e) => s + Number(e.amount), 0);
      const pending  = entries.filter(e => e.type === 'pending' ).reduce((s, e) => s + Number(e.amount), 0);
      const total    = received + pending;

      const pctGreen = Math.min((received / GOAL) * 100, 100);
      const pctGray  = Math.min((pending  / GOAL) * 100, Math.max(0, 100 - pctGreen));
      const pctTotal = Math.min((total    / GOAL) * 100, 100);

      document.getElementById('bar-green').style.width   = pctGreen + '%';
      document.getElementById('bar-gray').style.width    = pctGray  + '%';
      document.getElementById('bar-percent').textContent = Math.round(pctTotal) + '%';

      document.getElementById('total-display').innerHTML = fmt(total) + '<span class="unit">€</span>';
      document.getElementById('stat-green').textContent  = fmt(received) + '€';
      document.getElementById('stat-gray').textContent   = fmt(pending)  + '€';
      document.getElementById('stat-left').textContent   = fmt(Math.max(0, GOAL - total)) + '€';

      const list = document.getElementById('tx-list');
      if (entries.length === 0) {
        list.innerHTML = '<p class="empty-state">Aún no se ha añadido ningún ingreso.</p>';
        return;
      }

      list.innerHTML = entries.map(e => {
        const cls   = e.type === 'received' ? 'green' : 'gray';
        const label = e.type === 'received' ? 'Recibido' : 'Pendiente';
        const sign  = e.type === 'received' ? '+' : '~';
        const color = e.type === 'received' ? '#4ade80' : '#a1a1aa';
        return `
          <div class="tx-item">
            <div class="tx-left">
              <span class="tx-icon" style="background:${color}"></span>
              <span class="tx-desc">${label}</span>
            </div>
            <div style="display:flex;align-items:center;gap:4px">
              <span class="tx-amount ${cls}">${sign}${fmt(e.amount)}€</span>
              <button class="tx-delete" onclick="deleteMoney('${e.id}')" title="Eliminar">×</button>
            </div>
          </div>`;
      }).join('');
    }

    document.getElementById('input-green').addEventListener('keydown', e => e.key === 'Enter' && addMoney('received'));
    document.getElementById('input-gray' ).addEventListener('keydown', e => e.key === 'Enter' && addMoney('pending'));

    load();
    setInterval(() => load(true), 5000);
    window.addEventListener('focus', () => load(true));
  </script>
</body>
</html>
